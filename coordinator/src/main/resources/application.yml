# Defaults for running outside Docker against the Compose services on localhost.
# In Compose, SPRING_* environment variables override these.
spring:
  application:
    name: coordinator
  datasource:
    url: jdbc:postgresql://localhost:5432/birthdays
    username: admin
    password: pass
    hikari:
      data-source-properties:
        # Leave row values (names and emails) out of Postgres errors, and so out of the logs.
        logServerErrorDetail: false
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: pass
    # ReminderPublisher waits for RabbitMQ to confirm each reminder. Publishing as mandatory
    # makes RabbitMQ return a reminder that no queue received, instead of dropping it.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        retry:
          # Retry a failed message 3 times, 1, 2 and 4 seconds apart.
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
        # Then reject it without putting it back on the queue, so RabbitMQ moves it to
        # birthday.submissions.dlq instead of redelivering it forever.
        default-requeue-rejected: false

management:
  endpoint:
    health:
      # List db and rabbit as components, so the health check shows what's down.
      show-components: always

reminders:
  # When ReminderJob runs, in UTC: every day at midnight. The fields are second, minute,
  # hour, day of month, month and day of week.
  cron: "0 0 0 * * *"

---
# The local profile, which Compose turns on, runs the reminder job every minute, so a
# reminder appears soon after a submission whose window is open.
spring:
  config:
    activate:
      on-profile: local
reminders:
  cron: "0 * * * * *"
